envVarGroups:
  - name: arabic-academy-shared
    envVars:
      - key: BOT_SYNC_SECRET
        sync: false

services:
  - type: web
    name: arabic-academy
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TELEGRAM_CONTACT
        sync: false
      - fromGroup: arabic-academy-shared
  - type: web
    name: arabic-academy-bot-free
    env: node
    plan: free
    rootDir: arab-bot
    healthCheckPath: /health
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TELEGRAM_CONTACT
        sync: false
      - key: BOT_DATABASE_URL
        sync: false
      - key: BOT_DATABASE_SCHEMA
        value: arab_bot
      - key: ACADEMY_API_URL
        value: https://arabic-academy.onrender.com
      - key: ACADEMY_ADMIN_URL
        value: https://arabic-academy.onrender.com/admin
      - fromGroup: arabic-academy-shared
