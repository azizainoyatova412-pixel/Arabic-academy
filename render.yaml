services:
  - type: web
    name: arabic-academy
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TELEGRAM_CONTACT
        sync: false
      - key: BOT_SYNC_SECRET
        sync: false
